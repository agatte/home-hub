services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: host
    environment:
      TZ: "America/Indiana/Indianapolis"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      # Admin webserver bound to LOOPBACK ONLY (v4+v6). Under host networking
      # a bare "8080" binds 0.0.0.0 → every LAN/guest device can reach the
      # admin UI; the password gated it but the pre-auth surface was exposed
      # (2026-06-01 network audit, #6). home-hub's PiholeService + the
      # /admin reverse-proxy both reach it via localhost, so nothing local
      # breaks; admin-from-another-device is now via SSH tunnel
      # (`ssh -L 8080:localhost:8080 homehub`). The `o` suffix = optional
      # bind (FTL won't fail to start if one family is unavailable).
      # DNS on :53 is unaffected — it stays LAN-wide.
      FTLCONF_webserver_port: "127.0.0.1:8080o,[::1]:8080o"
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped
    # Upstream resolver is the unbound service below (127.0.0.1#5335),
    # set in etc-pihole/pihole.toml -> dns.upstreams. Pi-hole stays on
    # host networking; it reaches unbound via the host loopback publish.

  # Recursive, DNSSEC-validating resolver. Pi-hole forwards queries here
  # instead of to Google/Cloudflare, so no third party sees the full query
  # stream — unbound walks the DNS tree from the root servers itself.
  # The image listens on :53 inside the container; we publish it ONLY on the
  # host loopback at 5335 (127.0.0.1:5335 -> container :53), so pihole reaches
  # it at 127.0.0.1#5335 and nothing on the LAN can. (Can't use host networking
  # here — unbound's :53 would collide with pihole's own :53.)
  unbound:
    image: mvance/unbound:latest  # TODO: pin to a released digest/tag once confirmed
    container_name: unbound
    restart: unless-stopped
    ports:
      - "127.0.0.1:5335:53/tcp"
      - "127.0.0.1:5335:53/udp"
