name: Check

# Feature branches are checked through pull_request; master gets full validation.
# workflow_dispatch is an explicit full-suite/release verification escape hatch.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Superseded PR runs should not burn 11 minutes of backend runner time.
# Never cancel a master or manually requested full check.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          # PR checkout defaults to a synthetic merge commit; depth 2 usually
          # includes its base parent. Missing ancestry fails open to full CI.
          fetch-depth: 2
      - name: Determine conservative test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_change_scope.py --event "$EVENT_NAME" --base "$BASE_SHA"

  lint:
    needs: scope
    # A classifier failure must not suppress backend checks. Keep job identity
    # stable for existing required-check protection.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Lint Python
        # Keep CI aligned with the validated repository toolchain. Unpinned
        # Ruff 0.16.1 enabled new rules across untouched legacy files.
        run: pip install ruff==0.15.10 && ruff check backend/

  test:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # TEMP #370: prevent indefinitely occupied runners during safety-race diagnosis.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -u -m pytest tests/ -v -o faulthandler_timeout=90
        env:
          APP_ENV: testing

  frontend:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-svelte/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte checks
        run: npm run check

      - name: Run vitest unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      # Playwright e2e tests require a live backend + frontend; not run in
      # CI yet. Run locally with `npm run test:e2e` after starting the dev
      # server, or against a deployed instance via PLAYWRIGHT_BASE_URL.
