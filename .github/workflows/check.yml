name: Check

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Lint Python
        # Keep CI aligned with the validated repository toolchain. Unpinned
        # Ruff 0.16.1 enabled new rules across untouched legacy files.
        run: pip install ruff==0.15.10 && ruff check backend/

  test:
    runs-on: ubuntu-latest
    # TEMP #370: prevent indefinitely occupied runners during safety-race diagnosis.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -u -m pytest tests/ -v -o faulthandler_timeout=90
        env:
          APP_ENV: testing


  # TEMP #370: isolate new source/Hue receipt tests without waiting for the full suite.
  # Remove after the hanging-test root cause is fixed and full CI is green.
  diagnose-370:
    if: github.ref == 'refs/heads/test/370-source-hue-receipts-ci-20261101' || github.head_ref == 'test/370-source-hue-receipts-ci-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Isolate the new source and Hue tests with hang tracebacks
        env:
          APP_ENV: testing
        run: >-
          python -u -m pytest -vv -o faulthandler_timeout=45
          tests/test_hue_worker_physical_owner.py
          tests/test_desk_v2_effect_acceptance.py
          tests/test_effective_owner_lease_publication_gate.py
          tests/test_physical_source_acceptance_gate.py
          tests/test_desk_owner_dispatch.py
          tests/test_desk_atomic_source_publication_contract.py
          tests/test_desk_source_publication_adversarial.py
          tests/test_decision_clock.py
          tests/test_circuit_breaker_skip.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte checks
        run: npm run check

      - name: Run vitest unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      # Playwright e2e tests require a live backend + frontend; not run in
      # CI yet. Run locally with `npm run test:e2e` after starting the dev
      # server, or against a deployed instance via PLAYWRIGHT_BASE_URL.
